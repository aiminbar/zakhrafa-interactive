<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أُلَاحِظُ وَأُقَارِنُ</title><style>:root{--ink:#073f3b;--green:#08765f;--gold:#c99737;--cream:#fffaf0;--bad:#b5544d}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f8f3e7;color:var(--ink)}.hero{height:210px;position:relative;overflow:hidden;border-bottom:3px solid var(--gold)}.hero img{width:100%;height:100%;object-fit:cover}.hero h1{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-size:clamp(28px,4vw,58px);color:#073f3b;text-shadow:0 2px 2px #fff,0 0 10px #fff,0 0 18px #fff;background:transparent;font-weight:800}.bar{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;padding:10px 16px;background:#fffdf8ee;border-bottom:1px solid #dfc98e}.bar b{margin-inline-start:auto}.fab,.btn{border:2px solid var(--gold);border-radius:999px;background:#fff;color:var(--ink);padding:10px 16px;font-weight:700;text-decoration:none;cursor:pointer}.btn{border:0;background:var(--green);color:#fff;border-radius:15px}.wrap{width:min(1120px,94%);margin:22px auto}.card{background:#fffdf8;border:1px solid #dfc98e;border-radius:24px;padding:24px;margin:18px 0;text-align:center}.lead{font-size:1.15rem;line-height:2}.visual{max-width:100%;max-height:430px;object-fit:contain;border-radius:18px}.choices{display:grid;gap:10px;margin-top:18px}.choice{padding:13px;border:2px solid #d8c69a;border-radius:16px;background:white;font:inherit;color:#1682e7;cursor:pointer}.good{border-color:#16835b!important;background:#e9f8ef!important}.bad{border-color:#b5544d!important;background:#fff0ee!important}.feedback{min-height:36px;font-weight:700;margin:12px}.hidden{display:none!important}.stagebar{display:flex;justify-content:center;gap:8px;margin:12px}.dot{padding:7px 12px;border-radius:999px;background:#eee}.dot.on{background:#dff3e8;font-weight:700}.pairgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.pick{border:3px solid transparent;border-radius:18px;padding:6px;background:#fff;cursor:pointer}.pick img{width:100%;border-radius:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.svgbox{display:flex;justify-content:center}.palette{display:flex;gap:12px;justify-content:center;margin:14px}.sw{width:40px;height:40px;border-radius:50%;border:3px solid white;outline:1px solid #aaa}.teacher{position:fixed;left:18px;bottom:18px;z-index:30}.panel{position:fixed;left:18px;bottom:70px;background:white;border:2px solid var(--gold);border-radius:16px;padding:10px;z-index:31;display:none}.panel.on{display:block}canvas{position:fixed;inset:0;z-index:25;pointer-events:none}canvas.on{pointer-events:auto}@media(max-width:700px){.hero{height:145px}.pairgrid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}</style></head><body><header class="hero"><img src="section-header.png" alt=""><h1>أُلَاحِظُ وَأُقَارِنُ</h1></header><nav class="bar"><a class="fab" href="index.html">🏠 الرئيسية</a><span></span><b>أُلَاحِظُ وَأُقَارِنُ</b></nav><main class="wrap"><section id="s1" class="card"><h2>أُلَاحِظُ التَّغَيُّرَ 👀</h2><img class="visual" src="abstraction-stages.png"><p class="lead"><b>مَاذَا حَدَثَ لِلْعُنْصُرِ النَّبَاتِيِّ عِنْدَ تَجْرِيدِهِ؟</b></p><div class="choices"><button class="choice" data-ok="1">بُسِّطَتْ بَعْضُ التَّفَاصِيلِ وَتَغَيَّرَ شَكْلُهُ إِلَى صِيَاغَةٍ زُخْرُفِيَّةٍ</button><button class="choice">اخْتَفَتْ عَلَاقَتُهُ بِالنَّبَاتِ تَمَامًا</button><button class="choice">أَصْبَحَ صُورَةً حَقِيقِيَّةً أَكْثَرَ</button></div><div class="feedback"></div><button id="to2" class="btn" style="display:none" onclick="s1.classList.add('hidden');s2.classList.remove('hidden')">🔎 اكْتَشِفِي الْعَلَاقَةَ</button></section><section id="s2" class="card hidden"><h2>🔎 اكْتَشِفِي الْعَلَاقَةَ</h2><p class="lead">صِلِي كُلَّ عُنْصُرٍ نَبَاتِيٍّ بِالْوَحْدَةِ الزُّخْرُفِيَّةِ الْمُسْتَوْحَاةِ مِنْهُ.</p><div class="pairgrid"><button class="pick" data-p="t"><img src="01_tulip_natural.png"></button><button class="pick" data-p="l"><img src="02_leaf_natural.png"></button><button class="pick" data-p="r"><img src="03_round_flower_natural.png"></button><button class="pick target" data-p="r"><img src="06_round_flower_ornament.png"></button><button class="pick target" data-p="t"><img src="04_tulip_ornament.png"></button><button class="pick target" data-p="l"><img src="05_leaf_ornament.png"></button></div><div id="mfb" class="feedback"></div></section><script>document.querySelectorAll('#s1 .choice').forEach(b=>b.onclick=()=>{if(b.dataset.ok){b.classList.add('good');b.parentElement.nextElementSibling.textContent='أَحْسَنْتِ! ✨';to2.style.display='inline-block'}else{b.classList.add('bad');b.parentElement.nextElementSibling.textContent='حَاوِلِي مَرَّةً أُخْرَى'}});let sel=null,done=new Set;document.querySelectorAll('#s2 .pick:not(.target)').forEach(b=>b.onclick=()=>{sel=b;document.querySelectorAll('#s2 .pick').forEach(x=>x.style.outline='');b.style.outline='4px solid #c99737'});document.querySelectorAll('#s2 .target').forEach(b=>b.onclick=()=>{if(!sel)return;if(b.dataset.p===sel.dataset.p){b.classList.add('good');sel.classList.add('good');done.add(b.dataset.p);sel=null;if(done.size===3)mfb.textContent='أَحْسَنْتِ! رَبَطْتِ كُلَّ عُنْصُرٍ بِوَحْدَتِهِ الزُّخْرُفِيَّةِ ✨'}else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),500)}})</script><div class="card"><a class="btn" href="game.html">التالي ←</a></div></main><canvas id="draw"></canvas><button class="fab teacher" onclick="toggleTeacher()">✏️ أدوات المعلمة</button><div id="panel" class="panel"><b>✏️ أدوات المعلمة</b><br><button onclick="tool='pen'">قلم</button><button onclick="tool='marker'">محدد</button><button onclick="tool='eraser'">ممحاة</button><span style="display:inline-flex;gap:5px;margin:6px"><button aria-label="أخضر" onclick="ink='#073f3b'" style="width:25px;height:25px;border-radius:50%;background:#073f3b"></button><button aria-label="أزرق" onclick="ink='#1682e7'" style="width:25px;height:25px;border-radius:50%;background:#1682e7"></button><button aria-label="أحمر" onclick="ink='#c84f4f'" style="width:25px;height:25px;border-radius:50%;background:#c84f4f"></button><button aria-label="ذهبي" onclick="ink='#c99737'" style="width:25px;height:25px;border-radius:50%;background:#c99737"></button></span><button onclick="undo()">↩</button><button onclick="clearC()">مسح</button></div><script>const c=document.getElementById('draw'),x=c.getContext('2d');let drawing=false,tool='pen',ink='#073f3b',hist=[];function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);function toggleTeacher(){panel.classList.toggle('on');c.classList.toggle('on')}c.onpointerdown=e=>{hist.push(c.toDataURL());drawing=true;x.beginPath();x.moveTo(e.clientX,e.clientY)};c.onpointermove=e=>{if(!drawing)return;x.lineCap='round';x.globalAlpha=tool==='marker'?.25:1;x.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';x.strokeStyle=ink;x.lineWidth=tool==='marker'?22:tool==='eraser'?30:4;x.lineTo(e.clientX,e.clientY);x.stroke()};c.onpointerup=()=>{drawing=false;x.globalAlpha=1;x.globalCompositeOperation='source-over'};function clearC(){x.clearRect(0,0,c.width,c.height)}function undo(){let u=hist.pop();clearC();if(u){let i=new Image;i.onload=()=>x.drawImage(i,0,0);i.src=u}}</script><script src="motivation.js"></script></body></html>
