<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أكتشف التوريق</title><link rel="stylesheet" href="new.css"></head><body><header class="hero"><img src="section-header.png" alt=""><h1>أَكْتَشِفُ التَّوْرِيقَ</h1></header><div class="bar"><a class="fab" href="index.html">🏠 الرئيسية</a><b>🔎 أَكْتَشِفُ</b></div><main class="wrap"><section class="card" id="choose"><h2>هَيَّا نَبْحَثُ عَنِ التَّوْرِيقِ</h2><p class="lead">اِخْتَارِي التَّكْوِينَاتِ الَّتِي تُمَثِّلُ التَّوْرِيقَ.</p><img class="visual" src="discover-options.png"><div class="grid4" id="opts"><button class="choice" data-i="0">①</button><button class="choice" data-i="1">②</button><button class="choice" data-i="2">③</button><button class="choice" data-i="3">④</button></div><p><button class="btn" onclick="check()">أَتَحَقَّقُ مِنْ إِجَابَتِي ✨</button></p><div class="feedback" id="fb"></div></section><section class="card hidden" id="lenssec"><h2>🌿 عَدَسَةُ الْفَنَّانَةِ</h2><p class="lead">🔎 حَرِّكِي الْعَدَسَةَ وَاكْتَشِفِي عَنَاصِرَ التَّوْرِيقِ الثَّلَاثَةَ.</p><div class="counter" id="count">اِكْتَشَفْتِ: ٠ / ٣ 🌿</div><div class="lenswrap" id="lw"><img id="base" src="lens-tawreeq.png"><div class="lens" id="lens"></div></div><div class="feedback" id="found"></div><a class="btn hidden" id="toDesign" href="design.html">✨ أُصَمِّمُ زَخْرَفَتِي</a></section></main><script src="common.js"></script><script>
let sel=new Set();document.querySelectorAll('#opts button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('selected')});function check(){if(sel.size===2&&sel.has(0)&&sel.has(3)){say('fb','أَحْسَنْتِ! 🌿 اكْتَشَفْتِ تَكْوِينَيِ التَّوْرِيقِ.',true);setTimeout(()=>{choose.classList.add('hidden');lenssec.classList.remove('hidden')},700)}else say('fb','حَاوِلِي مَرَّةً أُخْرَى 🌱 اخْتَارِي تَكْوِينَيْنِ نَبَاتِيَّيْنِ زُخْرُفِيَّيْنِ.',false)}
let got=new Set();const spots=[{x:.20,y:.55,n:'وَرَقَةٌ'},{x:.49,y:.58,n:'غُصْنٌ'},{x:.75,y:.38,n:'عُنْصُرٌ نَبَاتِيٌّ مُحَوَّرٌ'}];function move(e){let r=lw.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(x<0||y<0||x>r.width||y>r.height)return;lens.style.display='block';lens.style.left=(x-75)+'px';lens.style.top=(y-75)+'px';let iw=base.naturalWidth,ih=base.naturalHeight,zoom=2;lens.style.backgroundImage=`url('lens-tawreeq.png')`;lens.style.backgroundSize=`${r.width*zoom}px ${r.height*zoom}px`;lens.style.backgroundPosition=`${-(x*zoom-75)}px ${-(y*zoom-75)}px`;spots.forEach((s,i)=>{if(Math.hypot(x/r.width-s.x,y/r.height-s.y)<.12&&!got.has(i)){got.add(i);found.textContent=`✓ اكْتَشَفْتِ: ${s.n}`;count.textContent=`اِكْتَشَفْتِ: ${['٠','١','٢','٣'][got.size]} / ٣ 🌿`;if(got.size===3){found.textContent='أَحْسَنْتِ! 🔎 اكْتَشَفْتِ عَنَاصِرَ التَّوْرِيقِ الثَّلَاثَةَ. 🌿';toDesign.classList.remove('hidden')}}})}lw.addEventListener('pointermove',move);lw.addEventListener('pointerdown',move);
</script><script src="motivation.js"></script></body></html>
